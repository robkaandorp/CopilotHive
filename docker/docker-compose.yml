services:
  orchestrator:
    build:
      context: ..
      dockerfile: docker/orchestrator/Dockerfile
    ports:
      # gRPC (5000) is deliberately NOT published to the host: workers reach it over the
      # internal `hive` network only. Only the dashboard (5001) is host-published.
      - "5001:5001"
    environment:
      - GH_TOKEN
      - BRAIN_MODEL=${BRAIN_MODEL:-copilot/claude-sonnet-4.6}
      - GRPC_PORT=5000
      # Provider settings live on the ORCHESTRATOR and are provisioned to workers via
      # GetWorkerConfig. The worker GitHub token is NOT sourced from here — it comes from
      # the stored admin OAuth record.
      - LLM_PROVIDER=${LLM_PROVIDER:-copilot}
      - OLLAMA_API_KEY
      - OLLAMA_URL
      - OLLAMA_MODEL
      - GITHUB_MODEL
    command: ["--config-repo=https://github.com/robkaandorp/CopilotHive-Config.git"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - orchestrator-state:/app/state
    networks:
      - hive

  worker:
    build:
      context: ..
      dockerfile: docker/worker/Dockerfile
    # The worker is credential-free by design: no GH_TOKEN, no GITHUB_TOKEN, no LLM_PROVIDER
    # and no Ollama/GitHub model settings. All of them are provisioned by the orchestrator
    # over the internal-network-only GetWorkerConfig gRPC call.
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:5000
      - VERBOSE_LOGGING
      - CONFIG_REPO_URL=https://github.com/robkaandorp/CopilotHive-Config.git
    depends_on:
      orchestrator:
        condition: service_healthy
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    volumes:
      - diagnostics:/app/diagnostics
    networks:
      - hive

volumes:
  orchestrator-state:
  diagnostics:

networks:
  hive:
