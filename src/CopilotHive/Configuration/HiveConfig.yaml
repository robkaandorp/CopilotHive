# CopilotHive Configuration
version: "1.0"

# Repositories workers are allowed to work on
repositories:
  - name: my-app
    url: https://github.com/org/my-app.git
    default_branch: main
  - name: my-api
    url: https://github.com/org/my-api.git
    default_branch: main
    # release:          # Optional: enable release automation for this repo
    #   merge_to: main  # Branch to merge the feature branch into
    #   tag_branch: main # Branch to tag releases from

# Worker settings
workers:
  coder:
    model: claude-opus-4.6
    reasoning_effort: high
    context_window: 150000
  reviewer:
    model: gpt-5.4
    reasoning_effort: medium
  tester:
    model: claude-sonnet-4.6
    reasoning_effort: high
  improver:
    model: claude-sonnet-4.6
    reasoning_effort: medium
  docwriter:
    model: claude-haiku-4.5
    reasoning_effort: low

# Orchestrator settings
orchestrator:
  model: claude-sonnet-4.6
  reasoning_effort: high
  max_iterations: 10
  max_retries_per_task: 3
  verbose_logging: false
  brain_max_steps: 50           # Max tool-call steps per Brain request

# Model-level configuration
models:
  compaction_model: null  # Model for context compaction summaries (e.g. "copilot/gpt-5.4-mini"). Uses main model when null.
